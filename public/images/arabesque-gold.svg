<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <!-- Eight-pointed star (najmah) centred at the origin -->
    <path id="star"
      d="M34,0 L13.86,-5.74 L24.04,-24.04 L5.74,-13.86 L0,-34 L-5.74,-13.86 L-24.04,-24.04 L-13.86,-5.74 L-34,0 L-13.86,5.74 L-24.04,24.04 L-5.74,13.86 L0,34 L5.74,13.86 L24.04,24.04 L13.86,5.74 Z" />
    <!-- Small four-pointed cross tile that sits between the stars -->
    <path id="cross"
      d="M0,-12 L5,-5 L12,0 L5,5 L0,12 L-5,5 L-12,0 L-5,-5 Z" />
  </defs>
  <g fill="none" stroke="#b8893b" stroke-width="2.2" stroke-linejoin="round">
    <!-- Stars: centre + the four corners so the diagonals interlock across tiles -->
    <use href="#star" x="50" y="50" />
    <use href="#star" x="0" y="0" />
    <use href="#star" x="100" y="0" />
    <use href="#star" x="0" y="100" />
    <use href="#star" x="100" y="100" />
    <!-- Crosses fill the gaps at the edge midpoints -->
    <use href="#cross" x="50" y="0" />
    <use href="#cross" x="0" y="50" />
    <use href="#cross" x="100" y="50" />
    <use href="#cross" x="50" y="100" />
  </g>
</svg>
